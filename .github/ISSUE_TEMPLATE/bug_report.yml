name: Bug report
description: Report a problem with a Lumen repository
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so a maintainer can reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, build number, or commit hash where you saw this.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Android version and device, iOS version and device, or server environment.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or stack traces, with any personal data removed.
      render: shell
    validations:
      required: false
